<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saudável Mente - Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💚</text></svg>">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-light d-flex flex-column vh-100">
  <div class="container d-flex flex-column justify-content-center align-items-center flex-grow-1">
    
    <div class="text-center mb-4">
      <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
        <span style="font-size: 30px;">💚</span>
      </div>
      <h2 class="fw-bold text-dark mb-0">Care Plus Digital</h2>
      <p class="text-secondary small">SaudávelMente - Sua Saúde em Primeiro Lugar</p>
    </div>

    <div class="card p-4 shadow-sm border-0" style="width: 100%; max-width: 400px; border-radius: 20px;">
      <form>
        <div class="mb-3">
          <label for="email" class="form-label small fw-bold">Email ou CPF</label>
          <input type="email" class="form-control bg-light border-0" id="email" placeholder="joao@email.com">
        </div>
        
        <div class="mb-3">
          <label for="senha" class="form-label small fw-bold">Senha</label>
          <input type="password" class="form-control bg-light border-0" id="senha" placeholder="••••••">
        </div>

        <div class="mb-4 d-flex justify-content-between align-items-center">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="lembrar" checked>
            <label class="form-check-label small" for="lembrar">Lembrar-me</label>
          </div>
          <a href="#" class="text-decoration-none small">Esqueci a senha</a>
        </div>

        <button type="button"
          class="btn btn-primary w-100 py-2 mb-3 fw-bold"
          style="border-radius: 10px;"
          onclick="realizarLogin()">
          Entrar
        </button>
        
        <div class="text-center position-relative my-4">
          <hr>
          <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">ou</span>
        </div>

        <div class="d-grid gap-2">
          <button type="button" class="btn btn-outline-light text-dark border shadow-sm small py-2">
            <span class="me-2">🔵</span> Entrar com Google
          </button>
          <button type="button" class="btn btn-outline-light text-dark border shadow-sm small py-2">
            <span class="me-2">📱</span> Entrar com WhatsApp
          </button>
        </div>
      </form>
    </div>

    <div class="text-center mt-4">
      <p class="text-muted small">Não tem conta? <a href="#" class="text-decoration-none fw-bold">Criar conta</a></p>
    </div>

  </div>

  <footer class="bg-white text-center py-2 border-top">
    <div class="container">
      <p class="text-muted mb-0 small">&copy; 2026 Saudável Mente - Care Plus Digital. RM 567002 - 567535</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/saudavelMente.js"></script>

  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">

    <div id="liveToast"
      class="toast align-items-center text-white bg-primary border-0 shadow"
      role="alert">

      <div class="d-flex">

        <div class="toast-body fw-semibold" id="toastMessage">
          Mensagem
        </div>

        <button type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast">
        </button>
    </div>
  </div>
</div>
</body>
</html>
